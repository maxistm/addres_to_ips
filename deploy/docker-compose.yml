services:
  addres-to-ips:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: addres-to-ips
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - addres-to-ips-net

networks:
  addres-to-ips-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.10.0/24
